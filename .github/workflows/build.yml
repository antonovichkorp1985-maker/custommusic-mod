name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build fat jar
        run: chmod +x ./gradlew && ./gradlew shadowJar --no-daemon

      - name: Check fat jar for duplicated Minecraft libraries
        run: |
          # com.jcraft.jorbis, slf4j, commons-io уже есть в Minecraft.
          # Дубликат пакета -> java.lang.module.ResolutionException -> игра не запускается.
          BAD=$(unzip -Z1 build/libs/*-all.jar | grep -E "^(com/jcraft/|junit/|org/slf4j/|org/apache/commons/io/)" || true)
          if [ -n "$BAD" ]; then
            echo "::error::В fat jar попали классы, которые уже поставляет Minecraft:"
            echo "$BAD" | head -20
            exit 1
          fi
          echo "OK: дубликатов библиотек Minecraft нет"

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: custommusic-fat-jar
          path: build/libs/custommusic-1.0.0-all.jar
